name: C++ compiler checker

on: push

jobs:
  makefile_cpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compiling cpp00/ex00 files
        run: |
          cd cpp00
          cd ex00
          make workflow
      - name: Compiling cpp00/ex01 files
        run: |
          cd cpp00
          cd ex01
          make workflow
      - name: Compiling cpp01/ex00 files
        run: |
          cd cpp01
          cd ex00
          make workflow
      - name: Compiling cpp01/ex01 files
        run: |
          cd cpp01
          cd ex01
          make workflow
      - name: Compiling cpp01/ex02 files
        run: |
          cd cpp01
          cd ex02
          make workflow
      - name: Compiling cpp01/ex03 files
        run: |
          cd cpp01
          cd ex03
          make workflow
      - name: Compiling cpp01/ex04 files
        run: |
          cd cpp01
          cd ex04
          make workflow
      - name: Compiling cpp01/ex05 files
        run: |
          cd cpp01
          cd ex05
          make workflow
      - name: Compiling cpp02/ex00 files
        run: |
          cd cpp02
          cd ex00
          make workflow
      - name: Compiling cpp02/ex01 files
        run: |
          cd cpp02
          cd ex01
          make workflow
      - name: Compiling cpp02/ex02 files
        run: |
          cd cpp02
          cd ex02
          make workflow
      - name: Compiling cpp03/ex00 files
        run: |
          cd cpp03
          cd ex00
          make workflow
